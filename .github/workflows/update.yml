name: Update and deploy dividend-low-vol dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dividend-low-vol-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -U akshare pandas numpy requests

      - name: Update market data
        run: python updater.py

      - name: Commit fresh data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history_cache.json
          git diff --cached --quiet || (git commit -m "auto update market data" && git push)

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
