name: Update dividend low-vol data

on:
  workflow_dispatch:
  schedule:
    # Beijing weekdays 09:00-15:55. GitHub cron can be delayed by the platform.
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dividend-lowvol-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -U akshare pandas numpy
      - run: python updater.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history_cache.json
          git diff --cached --quiet || git commit -m "auto: refresh dividend low-vol data"
          git push
