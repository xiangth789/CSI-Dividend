name: Update dividend low-vol data V6.4 ETF proxy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dividend-lowvol-update-v64
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Yahoo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yfinance pandas numpy
      - name: Verify V6.4 files
        run: |
          echo "=== V6.4 ETF PROXY ==="
          head -n 5 updater.py
      - name: Update market data
        run: python updater.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history_cache.json
          git diff --cached --quiet || git commit -m "auto: refresh dividend low-vol V6.4"
          git push
