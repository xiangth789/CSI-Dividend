name: Update dividend low-vol data

on:
  workflow_dispatch:
  schedule:
    # 北京时间工作日约 09:00-15:55，每5分钟尝试更新一次
    # GitHub Actions cron 可能因平台负载延迟几分钟
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dividend-lowvol-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U akshare pandas numpy

      - name: Update market data
        run: python updater.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history_cache.json
          git diff --cached --quiet || git commit -m "auto: refresh dividend low-vol data"
          git push
