<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17766f">
<title>中证红利低波50 · 在线稳定版</title>
<style>
body{margin:0;background:#f3f1eb;color:#17322d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:650px;margin:auto;padding:14px 12px 28px}.top{display:flex;justify-content:space-between;gap:8px}h1{font-size:21px;margin:0 0 4px}
.sub,.note{font-size:10px;color:#71817d}.date{font-size:11px;color:#17766f;font-weight:700;text-align:right}.card{background:white;border:1px solid #dce1de;border-radius:16px;padding:13px;margin-top:11px}
.title{font-weight:900;border-left:5px solid #17766f;padding-left:8px;margin-bottom:10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#fafbf8;border:1px solid #e4e8e5;border-radius:11px;padding:10px}
.metric span{display:block;font-size:9px;color:#71817d}.metric b{display:block;font-size:19px;margin-top:3px}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip,select{background:#fff;border:1px solid #d8dfdb;border-radius:999px;padding:7px 10px;font-size:11px}
.chip.active{background:#17766f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stock{border-radius:15px;padding:11px;color:#fff;min-height:150px}
.d{background:#176f69}.g{background:#32988f}.m{background:#969e9b}.o{background:#c56d58}.r{background:#a9384b}.b{background:#7f8583}
.name{font-size:17px;font-weight:900}.code,.small{font-size:9px;opacity:.9}.big{font-size:26px;font-weight:900;line-height:1}.row{display:flex;justify-content:space-between;gap:6px;align-items:flex-end;margin-top:8px}.label{font-size:9px;opacity:.9}
.status{display:inline-block;padding:5px 8px;background:#eaf4f2;color:#17766f;border-radius:999px;font-size:10px;font-weight:800}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>中证红利低波50</h1><div class="sub">H30269 · 在线稳定版 · 5分钟刷新</div></div>
<div class="date"><div id="dataDate">数据日 --</div><div id="updated">更新 --</div></div></div>

<div class="card"><div class="title">01 · 指数年线位置</div>
<div class="metrics">
<div class="metric"><span>H30269 最新点位</span><b id="idxClose">--</b></div>
<div class="metric"><span>年线偏离率</span><b id="idxAnnual">--</b></div>
<div class="metric"><span>250日均线</span><b id="idxMA">--</b></div>
<div class="metric"><span>52周高点回撤</span><b id="idxDD">--</b></div>
</div><div style="margin-top:9px"><span class="status" id="status">正在读取云端数据…</span></div>
<div class="note" style="margin-top:8px">数据由后台生成，手机浏览器不再直接请求第三方行情接口，因此避免本地HTML跨域失败。</div></div>

<div class="card"><div class="title">02 · 50只成分股</div>
<div class="tools"><button class="chip active" data-f="all">全部</button><button class="chip" data-f="below">低于年线</button><button class="chip" data-f="deep">低于年线5%+</button><button class="chip" data-f="above">高于年线</button></div>
<select id="sort"><option value="annual">按年线偏离</option><option value="score">按位置评分</option><option value="dd">按回撤</option><option value="mom">按60日动量</option></select>
<div class="grid" id="grid"></div></div>

<div class="card"><div class="title">03 · 更新机制</div><div class="note">
页面每5分钟读取一次最新 data.json。后台任务在A股交易时段每5分钟尝试更新一次；GitHub Actions 的实际执行时间可能有几分钟延迟。<br><br>
位置评分：年线偏离35% + 52周回撤25% + 60日动量20% + 20日波动率20%。
</div></div>
</div>
<script>
let DATA=null,filter="all";
const signed=(x,d=2)=>(x>=0?"+":"")+Number(x).toFixed(d)+"%";
const cls=s=>s>=80?"d":s>=65?"g":s>=45?"m":s>=30?"o":"r";
const adv=s=>s>=80?"位置很有吸引力":s>=65?"偏有吸引力":s>=45?"中性":s>=30?"偏热 / 偏弱":"风险较高";
function render(){
 if(!DATA)return;
 const i=DATA.index||{};
 idxClose.textContent=i.close==null?"--":Number(i.close).toFixed(2);
 idxAnnual.textContent=i.annual==null?"--":signed(i.annual);
 idxMA.textContent=i.ma250==null?"--":Number(i.ma250).toFixed(2);
 idxDD.textContent=i.dd==null?"--":"-"+Number(i.dd).toFixed(2)+"%";
 dataDate.textContent="数据日 "+(DATA.market_date||"--");
 updated.textContent="更新 "+(DATA.updated_at||"--");
 status.textContent="云端数据正常 · "+(DATA.stocks?.length||0)+"只";
 let a=[...(DATA.stocks||[])];
 if(filter==="below")a=a.filter(x=>x.annual<0);
 if(filter==="deep")a=a.filter(x=>x.annual<=-5);
 if(filter==="above")a=a.filter(x=>x.annual>0);
 const s=sort.value;
 a.sort((x,y)=>s==="score"?y.score-x.score:s==="dd"?y.dd-x.dd:s==="mom"?y.mom-x.mom:x.annual-y.annual);
 grid.innerHTML=a.map(x=>`<div class="stock ${cls(x.score)}"><div class="name">${x.name}</div><div class="code">${x.code}</div>
 <div class="row"><div><div class="label">最新价</div><div class="big">${Number(x.close).toFixed(2)}</div></div><div style="text-align:right"><div class="label">位置评分</div><div class="big">${x.score}</div></div></div>
 <div class="row"><div><div class="label">年线偏离</div><b>${signed(x.annual)}</b></div><div style="text-align:right"><div class="label">52周回撤</div><b>-${Number(x.dd).toFixed(1)}%</b></div></div>
 <div class="row"><div><div class="label">60日动量</div><b>${signed(x.mom,1)}</b></div><div style="text-align:right"><div class="label">20日波动</div><b>${Number(x.vol).toFixed(1)}%</b></div></div>
 <div class="small" style="margin-top:8px;font-weight:800">${adv(x.score)}</div></div>`).join("");
}
async function load(){
 try{
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw 0; DATA=await r.json(); render();
 }catch(e){status.textContent="云端数据尚未生成 / 更新失败";}
}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;render()});
sort.onchange=render;load();setInterval(load,5*60*1000);
</script></body></html>
